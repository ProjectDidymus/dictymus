[package]
name = "dictymus"
version = "0.2.0"
edition = "2024"
publish = false

[package.metadata.patois]
translatable = true

[[bin]]
name = "dictymus"
path = "src/main.rs"

[dependencies]
dictymus-container = { path = "../dictymus-container" }
dictymus-core = { path = "../dictymus-core" }
dunce = "1.0"
patois = { workspace = true, features = ["ui"] }
wxdragon = { version = "0.9.18", features = ["webview"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
ship-shape = "0.1.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-manifest = "1.5.0"
patois-build = { workspace = true }
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
uiautomation = "0.25.0"

[package.metadata.release]
# cargo-release accepts a single hook command; cmd /c chains the checks.
pre-release-hook = [
    "cmd",
    "/c",
    "cargo fmt --all -- --check && cargo clippy -p dictymus-core -p dictymus-container -p xtask -- -D warnings && cargo test -p dictymus-core -p dictymus-container -p xtask",
]
# The file path resolves against this crate's directory.
pre-release-replacements = [
    { file = "../../CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
]
