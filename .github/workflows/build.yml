name: CI

on:
  push:
    branches: [master]
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p dictymus-core -p dictymus-container -p xtask --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: cargo test -p dictymus-core -p dictymus-container -p xtask

  build:
    name: Build (${{ matrix.name }})
    needs: [check, test]
    runs-on: ${{ matrix.os }}
    env:
      HAVE_MINISIGN_KEY: ${{ secrets.MINISIGN_KEY != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            msvc-arch: x64
            arch: x64
            artifact: |
              target/release/dictymus_setup-x64.exe*
              target/release/dictymus-x64.zip*
            artifact-name: dictymus-windows-x64
          - name: windows-arm64
            os: windows-11-arm
            msvc-arch: arm64
            arch: arm64
            artifact: |
              target/release/dictymus_setup-arm64.exe*
              target/release/dictymus-arm64.zip*
            artifact-name: dictymus-windows-arm64
          - name: macos-arm64
            os: macos-latest
            artifact: |
              target/release/dictymus-macos.dmg*
              target/release/dictymus-macos.zip*
            artifact-name: dictymus-macos
    steps:
      # Tags must be visible so build.rs can tell release builds (HEAD on a
      # tag) from development builds.
      - uses: actions/checkout@v7
        with:
          fetch-tags: true
      - name: Setup MSVC
        if: startsWith(matrix.name, 'windows')
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc-arch }}
      - name: Install build tools
        if: startsWith(matrix.name, 'macos')
        # gettext is keg-only, so its bin dir must be put on PATH explicitly.
        run: |
          brew install cmake ninja gettext
          echo "$(brew --prefix gettext)/bin" >> $GITHUB_PATH
      # msgfmt compiles po/*.po into the catalogs the binary embeds. MSYS2's
      # directories are appended at the end of PATH inside the cargo step,
      # keeping MSVC's tools ahead of MSYS2's same-named ones.
      - name: Install gettext via MSYS2
        if: startsWith(matrix.name, 'windows')
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            gettext
            mingw-w64-ucrt-x86_64-gettext-tools
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          prefix-key: v2-rust
          key: ${{ matrix.name }}
          cache-all-crates: true
          cache-workspace-crates: true
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-directories: ${{ runner.temp }}/wx-build
      # Builds the release binary, then the portable zip and the installer.
      - name: Build and package
        if: startsWith(matrix.name, 'windows')
        shell: pwsh
        env:
          # wxdragon-sys downloads the wxWidgets source and builds its CMake
          # trees here; rust-cache saves the directory through
          # cache-directories.
          WXWIDGETS_DIR: ${{ runner.temp }}/wx-build/source
          WXWIDGETS_BUILD_DIR: ${{ runner.temp }}/wx-build/wxwidgets
          WXDRAGON_SYS_BUILD_DIR: ${{ runner.temp }}/wx-build/wxdragon-sys
        run: |
          $env:PATH = "$env:PATH;${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin;${{ steps.msys2.outputs.msys2-location }}\usr\bin"
          cargo xtask release
      # Builds the release binary, then Dictymus.app, the DMG and the zip.
      - name: Build and package
        if: startsWith(matrix.name, 'macos')
        env:
          WXWIDGETS_DIR: ${{ runner.temp }}/wx-build/source
          WXWIDGETS_BUILD_DIR: ${{ runner.temp }}/wx-build/wxwidgets
          WXDRAGON_SYS_BUILD_DIR: ${{ runner.temp }}/wx-build/wxdragon-sys
          # Must stay in sync with LSMinimumSystemVersion in
          # crates/dictymus/build/macos.rs.
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: cargo xtask release
      # The debug test build reuses the release build's wx directories.
      - name: Run UI tests
        if: matrix.name == 'windows-x64'
        shell: pwsh
        env:
          WXWIDGETS_DIR: ${{ runner.temp }}/wx-build/source
          WXWIDGETS_BUILD_DIR: ${{ runner.temp }}/wx-build/wxwidgets
          WXDRAGON_SYS_BUILD_DIR: ${{ runner.temp }}/wx-build/wxdragon-sys
        run: |
          $env:PATH = "$env:PATH;${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin;${{ steps.msys2.outputs.msys2-location }}\usr\bin"
          cargo test -p dictymus -- --ignored
      # patois-build only warns when msgfmt is missing; fail hard instead of
      # shipping a release that silently lost its translations.
      - name: Assert translations were embedded
        shell: pwsh
        run: |
          if (-not (Test-Path "crates/dictymus/locale/nl/LC_MESSAGES/dictymus.mo")) {
            Write-Error "Dutch catalog missing - msgfmt was unavailable during the build"
            exit 1
          }
      - name: Verify macOS bundle
        if: startsWith(matrix.name, 'macos')
        run: |
          APP=target/release/Dictymus.app
          test -f "$APP/Contents/MacOS/dictymus"
          test -x "$APP/Contents/MacOS/dictymus"
          test -f "$APP/Contents/Resources/dictymus.icns"
          plutil -lint "$APP/Contents/Info.plist"
          hdiutil verify target/release/dictymus-macos.dmg
          unzip -l target/release/dictymus-macos.zip | grep -q "Dictymus.app/Contents/MacOS/dictymus"
      - name: Install minisign
        if: startsWith(matrix.name, 'windows') && github.event_name == 'push' && github.repository == 'ProjectDidymus/dictymus' && env.HAVE_MINISIGN_KEY == 'true'
        run: choco install minisign -y --no-progress
      - name: Sign updater assets
        if: startsWith(matrix.name, 'windows') && github.event_name == 'push' && github.repository == 'ProjectDidymus/dictymus' && env.HAVE_MINISIGN_KEY == 'true'
        shell: pwsh
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP "dictymus.key"
          [IO.File]::WriteAllText($keyPath, $env:MINISIGN_KEY)
          $pwPath = Join-Path $env:RUNNER_TEMP "dictymus.pw"
          [IO.File]::WriteAllText($pwPath, $env:MINISIGN_PASSWORD)
          Get-Content $pwPath | minisign -S -s $keyPath -m target/release/dictymus_setup-${{ matrix.arch }}.exe
          Get-Content $pwPath | minisign -S -s $keyPath -m target/release/dictymus-${{ matrix.arch }}.zip
          Remove-Item $keyPath, $pwPath
      - name: Sign updater assets
        if: startsWith(matrix.name, 'macos') && github.event_name == 'push' && github.repository == 'ProjectDidymus/dictymus' && env.HAVE_MINISIGN_KEY == 'true'
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          brew install minisign
          KEY_PATH="$RUNNER_TEMP/dictymus.key"
          printf '%s' "$MINISIGN_KEY" > "$KEY_PATH"
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$KEY_PATH" -m target/release/dictymus-macos.dmg
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$KEY_PATH" -m target/release/dictymus-macos.zip
          rm -f "$KEY_PATH"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30

  dev-release:
    name: Dev release
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'ProjectDidymus/dictymus'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history and tags: the release notes list commits since the last tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: dictymus-*
          path: artifacts
          merge-multiple: true
      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 --match '[0-9]*' --match 'v*' 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --abbrev=7 --pretty=format:"- %h %s" -20 HEAD)
          else
            COMMITS=$(git log --abbrev=7 --pretty=format:"- %h %s" "$PREV_TAG"..HEAD)
          fi
          {
            echo "commits<<EOF"
            echo "$COMMITS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Development Build
          prerelease: true
          body: |
            ## Commits since last release
            ${{ steps.notes.outputs.commits }}
          files: |
            artifacts/dictymus_setup-x64.exe
            artifacts/dictymus_setup-x64.exe.minisig
            artifacts/dictymus_setup-arm64.exe
            artifacts/dictymus_setup-arm64.exe.minisig
            artifacts/dictymus-x64.zip
            artifacts/dictymus-x64.zip.minisig
            artifacts/dictymus-arm64.zip
            artifacts/dictymus-arm64.zip.minisig
            artifacts/dictymus-macos.dmg
            artifacts/dictymus-macos.dmg.minisig
            artifacts/dictymus-macos.zip
            artifacts/dictymus-macos.zip.minisig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checkout first: it cleans the workspace directory, and the tagged
      # tree supplies CHANGELOG.md for the release body.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: dictymus-*
          path: artifacts
          merge-multiple: true
      # The body is the CHANGELOG.md section for this version: everything
      # between its "## [X.Y.Z]" heading and the next "## [" heading.
      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "## [" ver "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release_body.md
          if ! grep -q '[^[:space:]]' release_body.md; then
            echo "::error::CHANGELOG.md has no section for version $VERSION"
            exit 1
          fi
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/dictymus_setup-x64.exe
            artifacts/dictymus_setup-x64.exe.minisig
            artifacts/dictymus_setup-arm64.exe
            artifacts/dictymus_setup-arm64.exe.minisig
            artifacts/dictymus-x64.zip
            artifacts/dictymus-x64.zip.minisig
            artifacts/dictymus-arm64.zip
            artifacts/dictymus-arm64.zip.minisig
            artifacts/dictymus-macos.dmg
            artifacts/dictymus-macos.dmg.minisig
            artifacts/dictymus-macos.zip
            artifacts/dictymus-macos.zip.minisig
          body_path: release_body.md
          name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
