name: CI

on:
  push:
    branches: [master]
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p dictymus-core -p xtask -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: cargo test -p dictymus-core -p xtask

  ui-test:
    name: UI test (Windows)
    needs: [check, test]
    runs-on: windows-2025
    steps:
      # Tags must be visible so build.rs can tell release builds (HEAD on a
      # tag) from development builds.
      - uses: actions/checkout@v7
        with:
          fetch-tags: true
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          key: ui-test
          cache-all-crates: true
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # The wxWidgets source and CMake build trees live in nonstandard
      # directories under target/ that rust-cache's cleanup discards, so
      # they get their own cache; without it every run rebuilds wx from
      # scratch. restore-keys reuses a stale tree incrementally after a
      # Cargo.lock change.
      - name: Cache wxWidgets build
        uses: actions/cache@v6
        with:
          path: |
            target/debug/wxWidgets*
            target/debug/wxwidgets_cmake_build*
            target/debug/wxdragon_sys_cmake_build*
          key: wx-ui-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: wx-ui-test-
      # msgfmt compiles po/*.po into the catalogs the binary embeds. MSYS2's
      # directories are appended at the end of PATH inside the cargo step,
      # keeping MSVC's tools ahead of MSYS2's same-named ones.
      - name: Install gettext via MSYS2
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            gettext
            mingw-w64-ucrt-x86_64-gettext-tools
      - name: Run UI tests
        shell: pwsh
        run: |
          $env:PATH = "$env:PATH;${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin;${{ steps.msys2.outputs.msys2-location }}\usr\bin"
          cargo test -p dictymus -- --ignored

  build:
    name: Build (${{ matrix.name }})
    needs: [check, test]
    runs-on: ${{ matrix.os }}
    env:
      HAVE_MACOS_CERT: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' }}
      HAVE_NOTARY_KEY: ${{ secrets.APPSTORE_API_KEY_BASE64 != '' }}
      HAVE_MINISIGN_KEY: ${{ secrets.MINISIGN_KEY != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            msvc-arch: x64
            artifact: target/x86_64-pc-windows-msvc/release/dictymus.exe
            artifact-name: dictymus-windows-x64
          # Cross-compiled on the x64 runner: arm64 runners queue long and
          # their single-core speed roughly doubles the LTO-heavy build.
          - name: windows-arm64
            os: windows-2025
            target: aarch64-pc-windows-msvc
            msvc-arch: amd64_arm64
            artifact: target/aarch64-pc-windows-msvc/release/dictymus.exe
            artifact-name: dictymus-windows-arm64
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: target/dictymus-macos.*
            artifact-name: dictymus-macos
    steps:
      # Tags must be visible so build.rs can tell release builds (HEAD on a
      # tag) from development builds.
      - uses: actions/checkout@v7
        with:
          fetch-tags: true
      - name: Setup MSVC
        if: startsWith(matrix.name, 'windows')
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc-arch }}
      - name: Install build tools
        if: startsWith(matrix.name, 'macos')
        # gettext is keg-only, so its bin dir must be put on PATH explicitly.
        run: |
          brew install cmake ninja gettext
          echo "$(brew --prefix gettext)/bin" >> $GITHUB_PATH
      # msgfmt compiles po/*.po into the catalogs the binary embeds.
      # msgfmt compiles po/*.po into the catalogs the binary embeds. MSYS2's
      # directories are appended at the end of PATH inside the cargo step,
      # keeping MSVC's tools ahead of MSYS2's same-named ones.
      - name: Install gettext via MSYS2
        if: startsWith(matrix.name, 'windows')
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            gettext
            mingw-w64-ucrt-x86_64-gettext-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          prefix-key: v2-rust
          key: ${{ matrix.name }}
          cache-all-crates: true
          cache-workspace-crates: true
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # The wxWidgets source and CMake build trees live in nonstandard
      # directories under target/ that rust-cache's cleanup discards, so
      # they get their own cache; without it every run rebuilds wx from
      # scratch. restore-keys reuses a stale tree incrementally after a
      # Cargo.lock change.
      - name: Cache wxWidgets build
        if: startsWith(matrix.name, 'windows')
        uses: actions/cache@v6
        with:
          path: |
            target/${{ matrix.target }}/release/wxWidgets*
            target/${{ matrix.target }}/release/wxwidgets_cmake_build*
            target/${{ matrix.target }}/release/wxdragon_sys_cmake_build*
          key: wx-${{ matrix.name }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: wx-${{ matrix.name }}-
      - name: Build
        if: startsWith(matrix.name, 'windows')
        shell: pwsh
        run: |
          $env:PATH = "$env:PATH;${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin;${{ steps.msys2.outputs.msys2-location }}\usr\bin"
          cargo build --release -p dictymus --target ${{ matrix.target }}
      - name: Build
        if: startsWith(matrix.name, 'macos')
        env:
          # Must stay in sync with LSMinimumSystemVersion in the xtask
          # Info.plist.
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: cargo build --release -p dictymus --target ${{ matrix.target }}
      # patois-build only warns when msgfmt is missing; fail hard instead of
      # shipping a release that silently lost its translations.
      - name: Assert translations were embedded
        shell: pwsh
        run: |
          if (-not (Test-Path "crates/dictymus/locale/nl/LC_MESSAGES/dictymus.mo")) {
            Write-Error "Dutch catalog missing - msgfmt was unavailable during the build"
            exit 1
          }
      # Imports the Developer ID certificate into an ephemeral keychain and
      # exports MACOS_SIGN_IDENTITY so dist-mac signs the bundle. Dormant
      # until the signing secrets are configured.
      - name: Import signing certificate
        if: startsWith(matrix.name, 'macos') && github.event_name == 'push' && github.repository == 'ProjectDidymus/dictymus' && env.HAVE_MACOS_CERT == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/dictymus-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/dictymus-signing.keychain-db"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D -o "$CERT_PATH"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "No Developer ID Application identity found in the imported certificate" >&2
            exit 1
          fi
          echo "Found signing identity: $IDENTITY"
          echo "MACOS_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "MACOS_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          rm -f "$CERT_PATH"
      - name: Package macOS bundle
        if: startsWith(matrix.name, 'macos')
        run: cargo xtask dist-mac --target ${{ matrix.target }}
      - name: Verify macOS bundle
        if: startsWith(matrix.name, 'macos')
        run: |
          APP=target/dist-mac/Dictymus.app
          test -f "$APP/Contents/MacOS/dictymus"
          test -x "$APP/Contents/MacOS/dictymus"
          test -f "$APP/Contents/Resources/dictymus.icns"
          plutil -lint "$APP/Contents/Info.plist"
          hdiutil verify target/dictymus-macos.dmg
          unzip -l target/dictymus-macos.zip | grep -q "Dictymus.app/Contents/MacOS/dictymus"
      # Dormant until the App Store Connect API key secrets are configured.
      - name: Notarize and staple DMG
        if: startsWith(matrix.name, 'macos') && github.event_name == 'push' && github.repository == 'ProjectDidymus/dictymus' && env.HAVE_NOTARY_KEY == 'true'
        env:
          APPSTORE_API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          # Secrets set from a file carry a trailing newline that notarytool
          # rejects in --key-id/--issuer; strip whitespace defensively.
          KEY_ID=$(printf '%s' "$APPSTORE_API_KEY_ID" | tr -d '[:space:]')
          ISSUER_ID=$(printf '%s' "$APPSTORE_API_ISSUER_ID" | tr -d '[:space:]')
          KEY_PATH="$RUNNER_TEMP/AppStoreConnectAPIKey.p8"
          echo "$APPSTORE_API_KEY_BASE64" | base64 -D -o "$KEY_PATH"
          set +e
          xcrun notarytool submit target/dictymus-macos.dmg \
            --key "$KEY_PATH" --key-id "$KEY_ID" --issuer "$ISSUER_ID" \
            --wait --output-format json | tee notarization-result.json
          SUBMIT_STATUS=$?
          set -e
          SUBMISSION_ID=$(jq -r '.id // empty' notarization-result.json)
          SUBMIT_RESULT_STATUS=$(jq -r '.status // empty' notarization-result.json)
          if [ "$SUBMIT_STATUS" -ne 0 ] || [ "$SUBMIT_RESULT_STATUS" != "Accepted" ]; then
            echo "Notarization failed (exit $SUBMIT_STATUS, status '$SUBMIT_RESULT_STATUS'); fetching full log..."
            if [ -n "$SUBMISSION_ID" ]; then
              xcrun notarytool log "$SUBMISSION_ID" \
                --key "$KEY_PATH" --key-id "$KEY_ID" --issuer "$ISSUER_ID"
            fi
            rm -f "$KEY_PATH"
            exit 1
          fi
          xcrun stapler staple target/dictymus-macos.dmg
          rm -f "$KEY_PATH"
      - name: Sign updater zip
        if: startsWith(matrix.name, 'macos') && github.event_name == 'push' && github.repository == 'ProjectDidymus/dictymus' && env.HAVE_MINISIGN_KEY == 'true'
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          brew install minisign
          KEY_PATH="$RUNNER_TEMP/dictymus.key"
          printf '%s' "$MINISIGN_KEY" > "$KEY_PATH"
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$KEY_PATH" -m target/dictymus-macos.zip
          rm -f "$KEY_PATH"
      - name: Clean up signing keychain
        if: always() && startsWith(matrix.name, 'macos') && github.event_name == 'push' && github.repository == 'ProjectDidymus/dictymus'
        run: |
          if [ -n "$MACOS_KEYCHAIN_PATH" ] && [ -f "$MACOS_KEYCHAIN_PATH" ]; then
            security delete-keychain "$MACOS_KEYCHAIN_PATH" || true
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact }}
          retention-days: 30

  installer:
    name: Windows installer
    needs: [build]
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    env:
      HAVE_MINISIGN_KEY: ${{ secrets.MINISIGN_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          key: installer
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: actions/download-artifact@v8
        with:
          name: dictymus-windows-x64
          path: target/dist/windows/x86_64
      - uses: actions/download-artifact@v8
        with:
          name: dictymus-windows-arm64
          path: target/dist/windows/aarch64
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - run: cargo xtask dist --staging target/dist
      - name: Package updater assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/updater | Out-Null
          Compress-Archive -Path target/dist/windows/x86_64/dictymus.exe -DestinationPath target/updater/dictymus-x64.zip
          Compress-Archive -Path target/dist/windows/aarch64/dictymus.exe -DestinationPath target/updater/dictymus-arm64.zip
          Copy-Item target/dictymus_setup-x64.exe, target/dictymus_setup-arm64.exe target/updater/
      - name: Install minisign
        if: github.event_name == 'push' && github.repository == 'ProjectDidymus/dictymus' && env.HAVE_MINISIGN_KEY == 'true'
        run: choco install minisign -y --no-progress
      - name: Sign updater assets
        if: github.event_name == 'push' && github.repository == 'ProjectDidymus/dictymus' && env.HAVE_MINISIGN_KEY == 'true'
        shell: pwsh
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP "dictymus.key"
          [IO.File]::WriteAllText($keyPath, $env:MINISIGN_KEY)
          $pwPath = Join-Path $env:RUNNER_TEMP "dictymus.pw"
          [IO.File]::WriteAllText($pwPath, $env:MINISIGN_PASSWORD)
          Get-Content $pwPath | minisign -S -s $keyPath -m target/updater/dictymus_setup-x64.exe
          Get-Content $pwPath | minisign -S -s $keyPath -m target/updater/dictymus_setup-arm64.exe
          Get-Content $pwPath | minisign -S -s $keyPath -m target/updater/dictymus-x64.zip
          Get-Content $pwPath | minisign -S -s $keyPath -m target/updater/dictymus-arm64.zip
          Remove-Item $keyPath, $pwPath
      - uses: actions/upload-artifact@v7
        with:
          name: dictymus-windows-setup
          path: target/updater/*
          retention-days: 30

  dev-release:
    name: Dev release
    needs: [build, installer]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'ProjectDidymus/dictymus'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history and tags: the release notes list commits since the last tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: dictymus-windows-setup
          path: artifacts/windows-setup
      - uses: actions/download-artifact@v8
        with:
          name: dictymus-macos
          path: artifacts/macos
      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 --match '[0-9]*' --match 'v*' 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --abbrev=7 --pretty=format:"- %h %s" -20 HEAD)
          else
            COMMITS=$(git log --abbrev=7 --pretty=format:"- %h %s" "$PREV_TAG"..HEAD)
          fi
          {
            echo "commits<<EOF"
            echo "$COMMITS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Development Build
          prerelease: true
          body: |
            ## Commits since last release
            ${{ steps.notes.outputs.commits }}
          files: |
            artifacts/windows-setup/dictymus_setup-x64.exe
            artifacts/windows-setup/dictymus_setup-x64.exe.minisig
            artifacts/windows-setup/dictymus_setup-arm64.exe
            artifacts/windows-setup/dictymus_setup-arm64.exe.minisig
            artifacts/windows-setup/dictymus-x64.zip
            artifacts/windows-setup/dictymus-x64.zip.minisig
            artifacts/windows-setup/dictymus-arm64.zip
            artifacts/windows-setup/dictymus-arm64.zip.minisig
            artifacts/macos/dictymus-macos.dmg
            artifacts/macos/dictymus-macos.zip
            artifacts/macos/dictymus-macos.zip.minisig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Release
    needs: [build, installer]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checkout first: it cleans the workspace directory, and the tagged
      # tree supplies CHANGELOG.md for the release body.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dictymus-windows-setup
          path: artifacts/windows-setup
      - uses: actions/download-artifact@v8
        with:
          name: dictymus-macos
          path: artifacts/macos
      - name: Rename for release
        run: |
          cp artifacts/windows-setup/* .
          cp artifacts/macos/* .
      # The body is the CHANGELOG.md section for this version: everything
      # between its "## [X.Y.Z]" heading and the next "## [" heading.
      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "## [" ver "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release_body.md
          if ! grep -q '[^[:space:]]' release_body.md; then
            echo "::error::CHANGELOG.md has no section for version $VERSION"
            exit 1
          fi
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dictymus_setup-x64.exe
            dictymus_setup-x64.exe.minisig
            dictymus_setup-arm64.exe
            dictymus_setup-arm64.exe.minisig
            dictymus-x64.zip
            dictymus-x64.zip.minisig
            dictymus-arm64.zip
            dictymus-arm64.zip.minisig
            dictymus-macos.dmg
            dictymus-macos.zip
            dictymus-macos.zip.minisig
          body_path: release_body.md
          name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
