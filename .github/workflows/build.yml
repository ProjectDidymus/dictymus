name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Build
        run: |
          $env:WXWIDGETS_DIR = "${{ github.workspace }}\external\wxWidgets"
          cargo build --release -p dictymus

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dictymus-windows
          path: target/release/dictymus.exe
          retention-days: 30
