[workspace]
resolver = "2"
members = ["crates/dictymus-core", "crates/dictymus", "crates/dictymus-container", "xtask"]

[workspace.dependencies]
icu_normalizer = { version = "2", features = ["compiled_data"] }
icu_properties = { version = "2", features = ["compiled_data"] }
# Pinned to an upstream main rev that carries the multipass fix the Hebrew
# tables need (liblouis/louis-rs#21). Move to a registry version once a
# release contains it.
louis-rs = { git = "https://github.com/liblouis/louis-rs", rev = "5f380cc6186dad568ccaf523075b391248c01a3b" }
patois = "0.2.1"
patois-build = "0.1.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
dirs = "7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "parking_lot", "tracing-log"] }
tracing-appender = { version = "0.2", features = ["parking_lot"] }

[profile.release]
strip = "debuginfo"
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1

[patch.crates-io]
opendict-rs = { git = "https://github.com/leonardder/opendict-rs", branch = "dictymus" }
